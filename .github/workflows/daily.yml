name: Daily clips

on:
  schedule:
    - cron: "0 3 * * *"        # 03:00 UTC = 05:00 South Africa; schedules the next day's clips
  workflow_dispatch: {}         # run by hand from the Actions tab

permissions:
  contents: write               # commits the clip queue and history back to the repo

concurrency: clips

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Python packages (yt-dlp is always updated, sites change often)
        run: pip install -U -r requirements.txt
      - name: Cache the speech model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-${{ hashFiles('config.yaml') }}
      - name: Optional yt-dlp cookies (only if a site blocks downloads from GitHub)
        env:
          YTDLP_COOKIES: ${{ secrets.YTDLP_COOKIES }}
        run: |
          if [ -n "$YTDLP_COOKIES" ]; then
            printf '%s' "$YTDLP_COOKIES" > "$RUNNER_TEMP/cookies.txt"
            echo "YTDLP_COOKIES_FILE=$RUNNER_TEMP/cookies.txt" >> "$GITHUB_ENV"
          fi
      - name: Find highlights, render clips, schedule uploads
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}       # free
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}           # free backup (optional)
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}  # free last resort (optional)
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}    # paid, optional
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python run_daily.py
      - name: Keep the rendered clips (for posting to TikTok, Reels or a clipping campaign)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clips
          path: out/clips/
          retention-days: 14
          if-no-files-found: ignore
      - name: Save state
        if: always()
        run: |
          git config user.name "clip-bot"
          git config user.email "clip-bot@users.noreply.github.com"
          git add content
          git diff --cached --quiet || (git commit -m "Daily clips: update queue and history" && git pull --rebase && git push)
